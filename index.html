<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liberty Casino</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash" class="splash">
        <div class="splash-content">
            <div class="splash-logo">
                <div class="logo-glow"></div>
                <span>🎰</span>
            </div>
            <h1 class="splash-title">LIBERTY</h1>
            <p class="splash-sub">CASINO</p>
            <div class="splash-loader">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-left">
                <div class="app-logo">🎰</div>
                <span class="app-name">LIBERTY</span>
            </div>
            <div class="topbar-right">
                <button class="lang-btn" onclick="showLanguageSelector()">🌐</button>
                <div class="balance-pill">
                    <span class="bal-icon">💎</span>
                    <span class="bal-amount" id="balance">0.00</span>
                    <button class="bal-add" onclick="switchTab('wallet')">+</button>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content" id="content">
            <!-- Filled by JS -->
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </button>
            <button class="nav-item" data-tab="games" onclick="switchTab('games')">
                <span class="nav-icon">🎮</span>
                <span class="nav-label">Games</span>
            </button>
            <button class="nav-item" data-tab="wallet" onclick="switchTab('wallet')">
                <span class="nav-icon">💰</span>
                <span class="nav-label">Wallet</span>
            </button>
            <button class="nav-item" data-tab="rewards" onclick="switchTab('rewards')">
                <span class="nav-icon">🎁</span>
                <span class="nav-label">Rewards</span>
            </button>
            <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </button>
        </nav>

        <!-- Game Fullscreen Modal -->
        <div id="game-screen" class="game-screen hidden">
            <div class="game-topbar">
                <button class="back-btn" onclick="closeGame()">←</button>
                <span class="game-screen-title" id="game-title">Game</span>
                <div class="game-balance">💎 <span id="game-bal">0.00</span></div>
            </div>
            <div class="game-body" id="game-body"></div>
        </div>
    </div>

    <script src="js/lang.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/app.js"></script>
    <script src="js/games.js"></script>
    <script src="js/games2.js"></script>
    <script src="js/features.js"></script>
    <script src="js/games_premium.js"></script>
</body>
</html>
